<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:">
  <link rel="stylesheet" href="pet.css">
</head>
<body>
  <div id="stage">
    <div id="bubble" class="hit" role="status" aria-live="polite"><span id="bubble-text"></span><small id="bubble-hint"></small></div>
    <div id="pet" class="hit idle" title="">
      <div id="flip"><div id="sprite"></div></div>
      <div id="zzz" aria-hidden="true"><span>z</span><span>z</span><span>Z</span></div>
      <div id="hearts" aria-hidden="true"></div>
      <div id="shadow"></div>
      <div id="name"></div>
      <div id="timer" aria-live="polite"></div>
      <div id="prop" aria-hidden="true"></div>
    </div>
    <div id="garden" aria-hidden="true"></div>
  </div>
  <script src="species.js"></script>
  <script src="stroke.js"></script>
  <script src="pet.js"></script>
</body>
</html>
